server {
    # Listen on port 80 inside the Nginx container
    listen 80;

    # Serve the compiled React/Vite static files and handle SPA routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Fallback to index.html if the requested path isn't a file, letting the frontend router handle it
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: forward /register API requests directly to the backend container
    location /register {
        proxy_pass http://backend:3001/register;
    }

    # Reverse proxy: forward /login API requests directly to the backend container
    location /login {
        proxy_pass http://backend:3001/login;
    }
}
